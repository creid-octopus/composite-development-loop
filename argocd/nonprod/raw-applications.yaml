# ArgoCD ApplicationSet for raw YAML manifests (non-prod).
# Each environment deploys from k8s/raw/<env> into its own namespace.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: raw-applications
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: raw-devloop-demo-development
            environment: development
            namespace: devloop-demo-development
            path: k8s/raw/development
          - name: raw-devloop-demo-test
            environment: test
            namespace: devloop-demo-test
            path: k8s/raw/test
  template:
    metadata:
      name: '{{ name }}'
      annotations:
        argo.octopus.com/project.argocd-raw-yaml: "argocd-raw-yaml"
        argo.octopus.com/environment.argocd-raw-yaml: '{{ environment }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/creid-octopus/composite-development-loop.git
        targetRevision: HEAD
        name: argocd-raw-yaml
        path: '{{ path }}'
      destination:
        namespace: '{{ namespace }}'
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
