# Default values for devloop-demo.
# Per-environment overrides live in values-<env>.yaml.

appName: helm-devloop-demo
image:
  repository: ghcr.io/creid-octopus/composite-development-loop
  tag: 1.0.14-sha-a008a4d

replicaCount: 1
namespace: devloop-demo
configMapName: helm-devloop-demo-config

appEnv: Development

containerPort: 3000
servicePort: 80
probePath: /health

requestsCpu: 100m
requestsMemory: 128Mi
limitsCpu: 250m
limitsMemory: 256Mi

livenessInitialDelaySeconds: 10
livenessPeriodSeconds: 30
livenessFailureThreshold: 3

readinessInitialDelaySeconds: 5
readinessPeriodSeconds: 10
readinessFailureThreshold: 3
