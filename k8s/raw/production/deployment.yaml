apiVersion: apps/v1
kind: Deployment
metadata:
  name: devloop-demo
  labels:
    app: devloop-demo
  namespace: devloop-demo-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devloop-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1       # one extra pod during rollout
      maxUnavailable: 0  # never drop below desired count
  template:
    metadata:
      labels:
        app: devloop-demo
    spec:
      containers:
        - name: devloop-demo
          # Image reference — updated by Octopus/ArgoCD at deploy time.
          # For Octopus structured variable substitution: ghcr.io/<owner>/sample-webapp:#{Octopus.Release.Number}
          # For ArgoCD image updater: annotate with argocd-image-updater.argoproj.io/image-list
          image: ghcr.io/creid-octopus/composite-development-loop:1.0.14-sha-a008a4d
          ports:
            - containerPort: 3000
          env:
            # Runtime identity — set per environment via ConfigMap or Octopus variable substitution.
            # This is the only env var not baked into the image at build time.
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: devloop-demo-config
                  key: APP_ENV
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
