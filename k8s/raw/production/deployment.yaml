apiVersion: apps/v1
kind: Deployment
metadata:
  name: raw-devloop-demo
  labels:
    app: raw-devloop-demo
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/commit: "unknown"
    app.kubernetes.io/environment: "Production"
  namespace: devloop-demo-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: raw-devloop-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1       # one extra pod during rollout
      maxUnavailable: 0  # never drop below desired count
  template:
    metadata:
      labels:
        app: raw-devloop-demo
        app.kubernetes.io/version: "latest"
        app.kubernetes.io/commit: "unknown"
        app.kubernetes.io/environment: "Production"
      annotations:
        ad.datadoghq.com/raw-devloop-demo: |
          checks:
            http_check:
              - init_config:
                instances:
                  - name: pod health
                    url: "http://%%host%%:3000/health"
                    timeout: 1
    spec:
      containers:
        - name: raw-devloop-demo
          image: ghcr.io/creid-octopus/composite-development-loop:1.0.19-sha-63c2f43
          ports:
            - containerPort: 3000
          env:
            # DataDog APM
            - name: DD_TRACE_ENABLED
              value: "false"
            - name: DD_SERVICE
              value: "raw-devloop-demo"
            # Runtime identity — set per environment via ConfigMap or Octopus variable substitution.
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: raw-devloop-demo-config
                  key: APP_ENV
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
