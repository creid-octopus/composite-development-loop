apiVersion: v1
kind: Service
metadata:
  name: raw-devloop-demo
  labels:
    app: raw-devloop-demo
  namespace: devloop-demo-development
spec:
  type: LoadBalancer
  selector:
    app: raw-devloop-demo
  ports:
    - name: http
      port: 80
      targetPort: 3000
  # Docker Desktop: external IP resolves to localhost
  # AKS: Azure provisions a public IP via cloud-provider-azure
