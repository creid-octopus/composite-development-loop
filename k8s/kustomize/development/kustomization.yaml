# Overlay for Kustomize-built devloop-demo (development).
# Applies namespace patch and namePrefix on top of base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

namePrefix: kustomize-

namespace: devloop-demo-development

patches:
  # Patch ConfigMap APP_ENV
  - target:
      kind: ConfigMap
    patch: |
      - op: replace
        path: /data/APP_ENV
        value: "Development"

  # Environment label on the app pods
  - target:
      kind: Deployment
      name: devloop-demo
    patch: |
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1environment
        value: "Development"
