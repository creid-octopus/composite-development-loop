# Overlay for Kustomize-built devloop-demo (development).
# Applies namespace patch and namePrefix on top of base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

namePrefix: kustomize-

namespace: devloop-demo-development

patches:
  # Patch ConfigMap APP_ENV
  - target:
      kind: ConfigMap
    patch: |
      - op: replace
        path: /data/APP_ENV
        value: "Development"

# Patch pod labels, env vars, and annotations
  - target:
      kind: Deployment
    patch: |
      # Environment label — used by DataDog Agent for auto-tagging
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1environment
        value: "Development"

      # DD_TRACE_ENABLED — enable dd-trace package in dev
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "true"

      # DD_SERVICE — include namePrefix so it matches the annotation key
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "kustomize-devloop-demo"
