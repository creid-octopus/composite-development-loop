apiVersion: apps/v1
kind: Deployment
metadata:
  name: devloop-demo
  labels:
    app: devloop-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devloop-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1       # one extra pod during rollout
      maxUnavailable: 0  # never drop below desired count
  template:
    metadata:
      labels:
        app: devloop-demo
        app.kubernetes.io/version: "default"
        app.kubernetes.io/environment: "default"
      annotations:
        ad.datadoghq.com/devloop-demo: |
          checks:
            http_check:
              - init_config:
                instances:
                  - name: pod health
                    url: "http://%%host%%:3000/health"
                    timeout: 1
    spec:
      containers:
        - name: devloop-demo
          image: ghcr.io/creid-octopus/composite-development-loop:1.0.14-sha-a008a4d
          ports:
            - containerPort: 3000
          env:
            - name: DD_TRACE_ENABLED
              value: "false"
            - name: DD_SERVICE
              value: "devloop-demo"
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: devloop-demo-config
                  key: APP_ENV
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
