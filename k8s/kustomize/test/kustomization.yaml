# Overlay for Kustomize-built devloop-demo (test).
# Applies namespace patch and namePrefix on top of base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

namePrefix: kustomize-

namespace: devloop-demo-test

patches:
  - target:
      kind: ConfigMap
    patch: |
      - op: replace
        path: /data/APP_ENV
        value: "Test"
